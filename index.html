<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1st Quarter Project | SKU Generator</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- PyScript -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2025.3.1/core.css"
    >

    <script
        type="module"
        src="https://pyscript.net/releases/2025.3.1/core.js"
    ></script>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .main-container {
            max-width: 700px;
            margin: 60px auto;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            border-radius: 15px 15px 0 0 !important;
        }

        .result-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .sku-code {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-box"></i>
                SKU Generator
            </a>

            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm me-2">
                    SKU Generator
                </a>

                <a href="receipt_generator.html" class="btn btn-outline-light btn-sm">
                    Receipt Generator
                </a>
            </div>

        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <div class="container main-container">

        <div class="card">

            <div class="card-header bg-dark text-white text-center">

                <h2 class="mb-1">
                    <i class="fa-solid fa-barcode"></i>
                    SKU Generator
                </h2>

                <p class="mb-0">
                    Generate a unique Stock Keeping Unit
                </p>

            </div>


            <div class="card-body p-4">

                <!-- CATEGORY -->
                <div class="mb-3">

                    <label for="category" class="form-label">
                        Product Category
                    </label>

                    <select id="category" class="form-select">

                        <option value="Perishables">
                            Perishables
                        </option>

                        <option value="Beverages">
                            Beverages
                        </option>

                        <option value="Disposables">
                            Disposables
                        </option>

                        <option value="Packaging">
                            Packaging
                        </option>

                    </select>

                </div>


                <!-- PRODUCT NAME -->
                <div class="mb-3">

                    <label for="product_name" class="form-label">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="product_name"
                        class="form-control"
                        placeholder="Enter product name"
                    >

                </div>


                <!-- QUANTITY -->
                <div class="mb-3">

                    <label for="quantity" class="form-label">
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        class="form-control"
                        placeholder="Enter stock quantity"
                        min="0"
                    >

                </div>


                <!-- BUTTON -->
                <div class="d-grid">

                    <input
                        type="button"
                        py-click="SKU_generator"
                        value="Generate SKU"
                        class="btn btn-dark"
                    >

                </div>


                <!-- OUTPUT -->
                <div id="sku_output" class="mt-3"></div>

            </div>

        </div>

    </div>


    <!-- PYTHON -->
    <script type="py" src="main.py"></script>

</body>
</html>
