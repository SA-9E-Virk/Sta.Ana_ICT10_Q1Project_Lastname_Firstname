<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1st Quarter Project | Watch Receipt Generator</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />

    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #2a9714 0%, #15ad99 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .app-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.25);
        }

        .app-card .card-header {
            border-radius: 1rem 1rem 0 0;
            background: linear-gradient(90deg, #328f1b, #55cabb);
            color: #fff;
            padding: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .btn-generate {
            background: linear-gradient(90deg, #3ad4c0, #6610f2);
            border: none;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-generate:hover {
            opacity: 0.9;
            color: #fff;
        }

        .watch-item {
            background: #f8f9fa;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            border-left: 5px solid #3ed87e;
        }

        .watch-price {
            color: #27cc71;
            font-weight: 700;
        }

        .receipt-box {
            background: #f8f9fa;
            border-left: 5px solid #3ed87e;
            border-radius: 0.5rem;
            padding: 1rem 1.25rem;
        }

        py-terminal {
            display: none;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark"
         style="background-color: #0b2545;">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">

            </a>

            <button class="navbar-toggler"
                    type="button"

                    data-bs-target="#navMenu">
